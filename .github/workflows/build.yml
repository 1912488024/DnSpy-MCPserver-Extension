name: Build dnSpy with MCP Extension

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore dnSpy.sln

    - name: Build entire dnSpy solution
      run: msbuild dnSpy.sln /p:Configuration=Release /p:Platform="Any CPU" /m /verbosity:minimal

    - name: Verify extension was built
      run: |
        dir "Extensions\Examples\Example1.Extension\bin\Release\net48\" || echo "Extension not found, but continuing"

    - name: Upload full build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dnSpy-MCP-Full-Build
        path: |
          dnSpy\dnSpy\bin\Release\net48\
          Extensions\Examples\Example1.Extension\bin\Release\net48\
        if-no-files-found: warn
