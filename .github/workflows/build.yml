name: Build dnSpy with MCP Extension (NET48)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore dnSpy.sln

    - name: Build entire solution (NET48)
      run: msbuild dnSpy.sln /p:Configuration=Release /p:Platform="Any CPU" /m:1 /verbosity:minimal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dnSpy-MCP-NET48-Build
        path: |
          dnSpy\dnSpy\bin\Release\net48\
          Extensions\Examples\Example1.Extension\bin\Release\net48\
        if-no-files-found: warn
