name: Build dnSpy and MCP Extension

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build solution
      run: msbuild dnSpy.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dnspy-with-extension
        path: |
          dnSpy\dnSpy\bin\Release\net48\
          extensions\examples\Example1.Extension\bin\Release\net48\
